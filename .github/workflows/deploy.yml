name: Build and deploy ConfigTool

on:
  push:
    branches:
      - v3.6-dev
      - v3.7-dev
      - v3.8-dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ConfigTool
        run: npm run build

      # Keyed on the branch so this file stays identical everywhere and survives merges between lines
      - name: Determine deployment target
        id: target
        run: |
          case "${{ github.ref_name }}" in
            v3.6-dev) path=/var/www/configtool/3.6 ;;
            v3.7-dev) path=/var/www/configtool ;;
            *) path=/var/www/configtool/beta ;;
          esac
          echo "remote_path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload ConfigTool to web root
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: pkg.duet3d.com
          port: 22
          username: configtool
          privateKey: ${{ secrets.CONFIGTOOL_DEPLOY_KEY }}
          localPath: ./dist
          remotePath: ${{ steps.target.outputs.remote_path }}
